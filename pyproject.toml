[project]
name = "contract-analyzer"
version = "1.0.0"
description = "LLM-powered contract analysis API with multi-provider support"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "S", "B", "A"]
ignore = [
    "S101",   # allow assert in tests
    "B008",   # FastAPI uses File()/Form()/Header() as default args — intentional pattern
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_return_any = false
warn_unused_ignores = false

# Third-party libs with incomplete stubs — skip entirely
[[tool.mypy.overrides]]
module = ["litellm.*", "chromadb.*", "sentence_transformers.*", "celery.*", "pdfplumber.*", "pdf2image.*", "pytesseract.*"]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=60"

[tool.coverage.run]
omit = ["tests/*", "scripts/*"]
